<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f4ee">
<title>جيبي — بطاقاتك بجيبك</title>
<meta name="description" content="بطاقات ولاء رقمية للمطاعم والكافيهات والصالونات والمتاجر — أختام، رصيد مسبق الدفع، ونقاط.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="jb.css">
<script src="config.js"></script>
<script src="qr.js"></script>
<script src="jb.js"></script>
<style>
  .hero{text-align:center;padding:28px 6px 10px}
  .hero .logo{width:72px;height:72px;border-radius:22px;background:var(--brand);color:#fff;font-size:40px;font-weight:800;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 14px 30px -12px var(--brand)}
  .hero h1{font-size:40px;margin:0;line-height:1.1}
  .hero p{font-size:18px;color:var(--muted);margin:8px 0 0}
  .feat{display:grid;gap:10px;margin-top:22px}
  .feat div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .feat b{display:block;font-size:16px}
  .feat span{color:var(--muted);font-size:14px}
  .mine a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">ج</div>
    <h1>جيبي</h1>
    <p>بطاقاتك بجيبك</p>
  </div>

  <div id="mine"></div>

  <div class="feat">
    <div><b>☕ بطاقة أختام</b><span>كل زيارة ختم، والمكافأة توصلك تلقائياً.</span></div>
    <div><b>🍽️ رصيد مسبق الدفع</b><span>وجبات، جلسات، غسلات… ينقص مع كل استخدام.</span></div>
    <div><b>⭐ نقاط</b><span>كل مبلغ يعطي نقاطاً تُستبدل بهدايا.</span></div>
  </div>

  <div class="footer">صاحب محل وتريد بطاقة لزبائنك؟ تواصل معنا<br><br>
    <span style="direction:ltr;display:inline-block"><b style="color:#2bd14f">OPEN END</b> TECHNOLOGY</span></div>
</div>
<script>
  const l = JB.myCards.all();
  if (l.length) document.getElementById("mine").innerHTML = `<h3 style="margin:18px 0 10px">بطاقاتي على هذا الجهاز</h3><div class="mine">${
    l.map((c) => `<a href="card.html?k=${encodeURIComponent(c.t)}"><span>${JB.esc(c.l)}</span><span>←</span></a>`).join("")}</div>`;
</script>
</body>
</html>
